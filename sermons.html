<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermons - Christ Temple International Ministry</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="sermons-page">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <a href="index.html">
                    <img src="assets/images/Christ Temple logo.svg" alt="Christ Temple International Ministry">
                </a>
            </div>
            <div class="nav-divider"></div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="sermons.html" class="active">Sermons</a></li>
                <li><a href="visit.html">Visit</a></li>
                <li><a href="#">Contact us</a></li>
            </ul>
        </div>

        <div class="nav-actions">
            <a href="#" class="btn-outline">Donate us</a>
        </div>
        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </nav>

    <!-- Sermons Library App -->
    <main class="sermons-app">
        <!-- Sidebar -->
        <aside class="sermons-sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Home
                </a>
                <a href="#" class="sidebar-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    Series
                </a>
                <a href="#" class="sidebar-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Live <span class="live-dot"></span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <section class="sermons-content">
            <!-- Header (Search) -->
            <header class="sermons-header">
                <div class="search-bar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" placeholder="Search sermons, speakers, or topics...">
                </div>
            </header>



            <!-- Latest Sermons -->
            <div class="sermons-section">
                <div class="sermons-section-header">
                    <h2 class="section-heading">Latest Sermons</h2>
                    <div class="sermons-controls">
                        <div class="control-group">
                            <label for="sortSelect" class="control-label">Sort by</label>
                            <select id="sortSelect" class="control-select">
                                <option value="newest">Newest First</option>
                                <option value="oldest">Oldest First</option>
                                <option value="title_asc">Title (A-Z)</option>
                                <option value="title_desc">Title (Z-A)</option>
                            </select>
                        </div>
                        <div class="view-toggle">
                            <button class="view-btn active" id="btnGridView" title="Grid View" aria-label="Grid View">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </button>
                            <button class="view-btn" id="btnListView" title="List View" aria-label="List View">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="8" y1="6" x2="21" y2="6"></line>
                                    <line x1="8" y1="12" x2="21" y2="12"></line>
                                    <line x1="8" y1="18" x2="21" y2="18"></line>
                                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="sermons-grid" id="sermonsGrid">
                    <!-- Sermons loaded dynamically via JavaScript -->
                    <p style="grid-column: 1 / -1; text-align: center; color: var(--on-surface-variant); padding: 2rem;">Loading sermons...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Global Audio Player -->
    <div class="audio-player" id="globalAudioPlayer">
        <div class="player-info">
            <div class="player-cover">
                <img src="assets/images/pexels-caleboquendo-34612562.jpg" alt="Cover" id="playerImage">
            </div>
            <div class="player-text">
                <h4 id="playerTitle">Select a sermon to play</h4>
                <p id="playerSpeaker">--</p>
            </div>
        </div>
        
        <div class="player-controls">
            <button class="control-btn" id="btnRewind" aria-label="Rewind 10 seconds" title="Rewind 10s">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 18l-8.5-6L20 6v12zm-9-12v12l-8.5-6L11 6z"/></svg>
            </button>
            <button class="control-btn" aria-label="Previous">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="control-btn play-btn" id="playPauseBtn" aria-label="Play">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="control-btn" aria-label="Next">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="control-btn" id="btnFastForward" aria-label="Fast Forward 10 seconds" title="Fast Forward 10s">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
            </button>
        </div>
        
        <div class="player-progress">
            <span class="time-current">0:00</span>
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-filled" style="width: 0%;">
                        <div class="progress-thumb"></div>
                    </div>
                </div>
            </div>
            <span class="time-total" id="playerDuration">0:00</span>
        </div>
        
        <div class="player-volume">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <div class="volume-slider">
                <div class="volume-filled" style="width: 70%;"></div>
            </div>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let isPlaying = false;
        let isDragging = false;
        
        const player = document.getElementById('globalAudioPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const playerImage = document.getElementById('playerImage');
        const playerTitle = document.getElementById('playerTitle');
        const playerSpeaker = document.getElementById('playerSpeaker');
        const playerDuration = document.getElementById('playerDuration');
        
        const timeCurrent = document.querySelector('.time-current');
        const progressContainer = document.querySelector('.progress-bar-container');
        const progressFilled = document.querySelector('.progress-filled');
        
        const volumeSlider = document.querySelector('.volume-slider');
        const volumeFilled = document.querySelector('.volume-filled');

        const btnFastForward = document.getElementById('btnFastForward');
        const btnRewind = document.getElementById('btnRewind');

        let activeCategory = 'All';
        let activeSearch = '';
        let activeSort = localStorage.getItem('sermons_sort') || 'newest';
        let activeView = localStorage.getItem('sermons_view') || 'grid';

        // Play a sermon (called on sermon card click)
        function playSermon(title, speaker, audioUrl, coverUrl) {
            playerTitle.textContent = title;
            playerSpeaker.textContent = speaker;
            if (coverUrl) {
                playerImage.src = coverUrl;
            } else {
                playerImage.src = 'assets/images/pexels-caleboquendo-34612562.jpg';
            }
            
            // Set audio source through streaming script to support HTTP Range requests (crucial for seeking & scrubbing)
            audio.src = 'api/stream.php?file=' + encodeURIComponent(audioUrl);
            audio.load();
            
            // Show player drawer
            player.classList.add('active');
            
            // Play audio
            audio.play()
                .then(() => {
                    isPlaying = true;
                    updatePlayButton();
                })
                .catch(err => {
                    console.error("Audio playback error:", err);
                    alert("Could not load or play audio. Please check the file format or link.");
                });
        }

        // Toggle Play/Pause on player control click
        playBtn.addEventListener('click', () => {
            if (audio.src) {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play();
                    isPlaying = true;
                }
                updatePlayButton();
            }
        });

        // Fast Forward & Rewind event listeners
        if (btnFastForward) {
            btnFastForward.addEventListener('click', () => {
                if (audio.src && !isNaN(audio.duration)) {
                    audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
                }
            });
        }

        if (btnRewind) {
            btnRewind.addEventListener('click', () => {
                if (audio.src && !isNaN(audio.duration)) {
                    audio.currentTime = Math.max(0, audio.currentTime - 10);
                }
            });
        }

        // Update Play/Pause button icons
        function updatePlayButton() {
            if (isPlaying) {
                playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            } else {
                playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            }
        }

        // Helper to format seconds to MM:SS
        function formatTime(secs) {
            if (secs === undefined || isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Audio Events
        audio.addEventListener('loadedmetadata', () => {
            playerDuration.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (!isDragging) {
                timeCurrent.textContent = formatTime(audio.currentTime);
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFilled.style.width = `${percent}%`;
                }
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            updatePlayButton();
            progressFilled.style.width = '0%';
            timeCurrent.textContent = '0:00';
        });

        // Advanced Progress Drag Scrubbing & Clicking
        if (progressContainer) {
            const handleScrub = (e) => {
                if (!audio.src || isNaN(audio.duration)) return 0;
                const rect = progressContainer.getBoundingClientRect();
                const clientX = e.clientX || 
                                (e.touches && e.touches[0] && e.touches[0].clientX) || 
                                (e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientX) || 
                                0;
                const clickX = clientX - rect.left;
                const width = rect.width;
                let clickPercent = clickX / width;
                clickPercent = Math.max(0, Math.min(1, clickPercent)); // Clamp between 0 and 1
                
                progressFilled.style.width = `${clickPercent * 100}%`;
                const tempTime = clickPercent * audio.duration;
                timeCurrent.textContent = formatTime(tempTime);
                
                return tempTime;
            };

            progressContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                handleScrub(e);
            });

            progressContainer.addEventListener('touchstart', (e) => {
                isDragging = true;
                handleScrub(e);
            }, { passive: true });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    handleScrub(e);
                }
            });

            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    handleScrub(e);
                }
            }, { passive: true });

            const stopDragging = (e) => {
                if (isDragging) {
                    const finalTime = handleScrub(e);
                    if (finalTime !== undefined) {
                        audio.currentTime = finalTime;
                    }
                    isDragging = false;
                }
            };

            document.addEventListener('mouseup', stopDragging);
            document.addEventListener('touchend', stopDragging);
        }

        // Volume Adjustments
        if (volumeSlider) {
            volumeSlider.addEventListener('click', (e) => {
                const rect = volumeSlider.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                let vol = clickX / width;
                vol = Math.max(0, Math.min(1, vol)); // Clamp between 0 and 1
                audio.volume = vol;
                volumeFilled.style.width = `${vol * 100}%`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            const navbar = document.querySelector('.navbar');
            
            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', () => {
                    navbar.classList.toggle('mobile-open');
                });
            }

            // Set up search bar listener
            const searchInput = document.querySelector('.search-bar input');
            if (searchInput) {
                let debounceTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(debounceTimeout);
                    debounceTimeout = setTimeout(() => {
                        activeSearch = e.target.value;
                        fetchSermons();
                    }, 300);
                });
            }



            // Set up sort selector listener
            const sortSelect = document.getElementById('sortSelect');
            if (sortSelect) {
                sortSelect.value = activeSort;
                sortSelect.addEventListener('change', (e) => {
                    activeSort = e.target.value;
                    localStorage.setItem('sermons_sort', activeSort);
                    fetchSermons();
                });
            }

            // Set up view layout toggles
            const grid = document.getElementById('sermonsGrid');
            const btnGridView = document.getElementById('btnGridView');
            const btnListView = document.getElementById('btnListView');

            function applyView(view) {
                activeView = view;
                localStorage.setItem('sermons_view', view);
                if (view === 'list') {
                    grid.classList.add('list-view');
                    if (btnListView) btnListView.classList.add('active');
                    if (btnGridView) btnGridView.classList.remove('active');
                } else {
                    grid.classList.remove('list-view');
                    if (btnGridView) btnGridView.classList.add('active');
                    if (btnListView) btnListView.classList.remove('active');
                }
            }

            if (btnGridView && btnListView) {
                btnGridView.addEventListener('click', () => applyView('grid'));
                btnListView.addEventListener('click', () => applyView('list'));
            }

            // Apply saved layout view on load
            applyView(activeView);

            // Fetch public sermons dynamically
            fetchSermons();
        });

        async function fetchSermons() {
            try {
                const response = await fetch(`api/get_sermons.php?limit=20&category=${encodeURIComponent(activeCategory)}&search=${encodeURIComponent(activeSearch)}&sort=${encodeURIComponent(activeSort)}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const grid = document.getElementById('sermonsGrid');
                    grid.innerHTML = '';
                    
                    if (result.data.length === 0) {
                        grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--on-surface-variant); padding: 2rem;">No sermons available matching your query.</p>';
                        return;
                    }
                    
                    result.data.forEach(sermon => {
                        // Dummy text duration or display nicely
                        const duration = "Sermon Audio"; 
                        
                        // We safely escape strings
                        const cleanTitle = sermon.title.replace(/'/g, "\\'");
                        const cleanSpeaker = sermon.speaker.replace(/'/g, "\\'");
                        const cleanAudio = sermon.audio_file_path.replace(/'/g, "\\'");
                        const cleanCover = sermon.cover_image_path.replace(/'/g, "\\'");

                        grid.innerHTML += `
                            <div class="sermon-card" onclick="playSermon('${cleanTitle}', '${cleanSpeaker}', '${cleanAudio}', '${cleanCover}')">
                                <div class="sermon-image">
                                    <img src="${sermon.cover_image_path}" alt="${sermon.title}">
                                    <div class="sermon-duration">${duration}</div>
                                    <div class="sermon-play-overlay">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M8 5v14l11-7z" />
                                        </svg>
                                    </div>
                                </div>
                                <div class="sermon-details">
                                    <h3 class="sermon-title">${sermon.title}</h3>
                                    <div class="sermon-meta">
                                        <span class="sermon-category">${sermon.category}</span>
                                        <span class="sermon-date">${sermon.formatted_date}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error('Error fetching public sermons:', error);
                document.getElementById('sermonsGrid').innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--error); padding: 2rem;">Error loading sermons.</p>';
            }
        }
    </script>
</body>
</html>
